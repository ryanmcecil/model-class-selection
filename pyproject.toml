[project]
name = "MCS"
version = "0.0.0"
description = "Tools for experimenting with model class selection methods"
authors = [
    {name = "Ryan Cecil",email = "ryanmcecil@gmail.com"}
]
readme = "Readme.md"
requires-python = "^3.9"
dependencies = [
    "numpy (==2.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "scikit-learn (==1.6)",
    "scipy (==1.13.1)",
    "matplotlib (==3.9.4)",
    "tqdm (>=4.67.1,<5.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
